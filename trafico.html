<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tráfico — Órdenes de carga</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0f1420; --card:#171d2b; --card2:#1e2536; --border:#2a3348;
    --text:#eef1f8; --muted:#9aa6bf; --accent:#3ea6ff; --ok:#34c98f; --bad:#ff5c5c;
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6fb; --card:#ffffff; --card2:#f0f2f8; --border:#dfe4ee;
      --text:#151a26; --muted:#5b657c;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px;width:100%}
  @media (min-width:760px){ .wrap{max-width:760px;padding:24px} }
  h1{font-size:1.15rem;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  label{font-size:.8rem;color:var(--muted);display:block;margin-top:8px}
  select,input[type=text],input[type=checkbox]{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px;font-size:1rem;margin-top:4px}
  input[type=checkbox]{width:auto;margin-top:0;vertical-align:middle}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.85rem;color:var(--text)}
  .row2{display:flex;gap:8px}
  .row2 > div{flex:1}
  .btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-size:1rem;font-weight:700;
    margin-top:14px;cursor:pointer;background:var(--accent);color:#04121f}
  .btn-sm{padding:8px 12px;font-size:.85rem;margin-top:6px;width:auto}
  .list{max-height:220px;overflow-y:auto;margin-top:8px}
  .item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
  .item:last-child{border-bottom:none}
  .badge{font-size:.7rem;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--muted)}
  .badge.ok{background:rgba(52,201,143,.15);color:var(--ok)}
  .msg{font-size:.8rem;margin-top:8px}
  .empty{color:var(--muted);font-size:.85rem;text-align:center;padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚦 Panel de Tráfico</h1>
  <div class="sub">Crea la orden de carga: el conductor la verá aparecer sola en su app</div>

  <div class="card">
    <strong>Cliente (cargador contractual)</strong>
    <select id="clienteSel"><option value="">Cargando…</option></select>
    <div class="row2">
      <input type="text" id="nuevoClienteNombre" placeholder="Nombre nuevo cliente">
      <input type="text" id="nuevoClienteNif" placeholder="NIF">
    </div>
    <input type="text" id="nuevoClienteDom" placeholder="Domicilio" style="margin-top:6px">
    <button class="btn btn-sm" id="addClienteBtn">+ Añadir cliente nuevo</button>
  </div>

  <div class="card">
    <strong>Transportista efectivo</strong>
    <select id="transSel"><option value="">Cargando…</option></select>
    <div class="row2">
      <input type="text" id="nuevoTransNombre" placeholder="Nombre nuevo transportista/autónomo">
      <input type="text" id="nuevoTransNif" placeholder="NIF">
    </div>
    <button class="btn btn-sm" id="addTransBtn">+ Añadir transportista nuevo</button>
  </div>

  <div class="card">
    <strong>Datos del viaje</strong>
    <label>Almacén / punto de recogida</label>
    <input type="text" id="almacen" value="Logística Norte">
    <label>Lugar de origen (dirección completa)</label>
    <input type="text" id="origen" value="Almacén Logística Norte, C/ Ejemplo 1, Sevilla">
    <label>Lugar de destino (dirección completa)</label>
    <input type="text" id="destino" value="Plataforma Ejemplo, Av. Ejemplo 22, Madrid">
    <label>Naturaleza de la mercancía</label>
    <input type="text" id="mercancia" value="Conservas envasadas">
    <label>Detalle planificado (lo que verá el conductor)</label>
    <input type="text" id="detalle" value="10 palets europeos">
    <div class="row2">
      <div>
        <label>Peso (kg)</label>
        <input type="text" id="peso" value="3200">
      </div>
      <div>
        <label>Matrícula asignada</label>
        <input type="text" id="matricula" value="0000-ABC / RM-0000-XX">
      </div>
    </div>
    <div class="chk"><input type="checkbox" id="pesoAprox" checked> <span>Peso aproximado (no pesado en báscula)</span></div>
  </div>

  <button class="btn" id="enviarBtn">📤 Enviar orden de carga al conductor</button>
  <div class="msg" id="enviarMsg"></div>

  <div class="card">
    <strong>Órdenes recientes</strong>
    <div class="list" id="historial"><div class="empty">Cargando…</div></div>
  </div>
</div>

<script>
try{
// ====== CONFIGURACIÓN SUPABASE (el mismo proyecto que usa index.html) ======
const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
const SUPABASE_ANON_KEY = 'TU_ANON_KEY_PUBLICA';
// =============================================================================
const sb = (SUPABASE_URL.includes('TU-PROYECTO')) ? null :
  window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function cargarSelect(tabla, selectId){
  const sel = document.getElementById(selectId);
  if(!sb){ sel.innerHTML = '<option value="">Sin conexión a Supabase</option>'; return; }
  try{
    const { data, error } = await sb.from(tabla).select('*').order('nombre');
    if(error){ sel.innerHTML = `<option value="">Error: ${error.message}</option>`; return; }
    sel.innerHTML = data.map(x=>`<option value="${x.id}">${x.nombre}${x.nif? ' · '+x.nif : ''}</option>`).join('')
      || '<option value="">Sin datos — añade uno abajo</option>';
  }catch(e){
    sel.innerHTML = `<option value="">Fallo de red: ${e.message}</option>`;
  }
}

document.getElementById('addClienteBtn').onclick = async ()=>{
  if(!sb) return;
  const nombre = document.getElementById('nuevoClienteNombre').value.trim();
  if(!nombre){ alert('Escribe al menos el nombre del cliente.'); return; }
  const nif = document.getElementById('nuevoClienteNif').value.trim();
  const domicilio = document.getElementById('nuevoClienteDom').value.trim();
  const { error } = await sb.from('clientes').insert({nombre, nif, domicilio});
  if(error){ alert('No se pudo añadir: ' + error.message); return; }
  document.getElementById('nuevoClienteNombre').value = '';
  document.getElementById('nuevoClienteNif').value = '';
  document.getElementById('nuevoClienteDom').value = '';
  cargarSelect('clientes','clienteSel');
};

document.getElementById('addTransBtn').onclick = async ()=>{
  if(!sb) return;
  const nombre = document.getElementById('nuevoTransNombre').value.trim();
  if(!nombre){ alert('Escribe al menos el nombre del transportista.'); return; }
  const nif = document.getElementById('nuevoTransNif').value.trim();
  const { error } = await sb.from('transportistas').insert({nombre, nif});
  if(error){ alert('No se pudo añadir: ' + error.message); return; }
  document.getElementById('nuevoTransNombre').value = '';
  document.getElementById('nuevoTransNif').value = '';
  cargarSelect('transportistas','transSel');
};

document.getElementById('enviarBtn').onclick = async ()=>{
  const msg = document.getElementById('enviarMsg');
  if(!sb){ msg.textContent = '⚠️ Configura SUPABASE_URL y SUPABASE_ANON_KEY arriba en el script.'; msg.style.color='var(--bad)'; return; }
  const clienteId = document.getElementById('clienteSel').value;
  const transId = document.getElementById('transSel').value;
  if(!clienteId || !transId){ msg.textContent = '⚠️ Elige un cliente y un transportista.'; msg.style.color='var(--bad)'; return; }

  const { error } = await sb.from('cargas_planificadas').insert({
    almacen: document.getElementById('almacen').value,
    detalle_planificado: document.getElementById('detalle').value,
    estado: 'asignada',
    cliente_id: clienteId,
    transportista_id: transId,
    origen: document.getElementById('origen').value,
    destino: document.getElementById('destino').value,
    mercancia: document.getElementById('mercancia').value,
    peso: document.getElementById('peso').value,
    peso_aproximado: document.getElementById('pesoAprox').checked,
    matricula: document.getElementById('matricula').value
  });
  if(error){ msg.textContent = '❌ Error: ' + error.message; msg.style.color='var(--bad)'; return; }
  msg.textContent = '✅ Orden enviada. El conductor la verá en su app en unos segundos.';
  msg.style.color = 'var(--ok)';
  cargarHistorial();
};

async function cargarHistorial(){
  const box = document.getElementById('historial');
  if(!sb){ box.innerHTML = '<div class="empty">Sin conexión a Supabase</div>'; return; }
  try{
    const { data, error } = await sb.from('cargas_planificadas')
      .select('*, clientes(nombre), transportistas(nombre)')
      .order('created_at', {ascending:false}).limit(10);
    if(error){ box.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
    if(!data.length){ box.innerHTML = '<div class="empty">Aún no hay órdenes enviadas</div>'; return; }
    box.innerHTML = data.map(o=>`<div class="item">
        <span>${o.detalle_planificado}<br><span class="badge">${o.clientes?.nombre||'—'} → ${o.transportistas?.nombre||'—'}</span></span>
        <span class="badge ${o.estado==='cerrada'?'ok':''}">${o.estado}</span>
      </div>`).join('');
  }catch(e){
    box.innerHTML = `<div class="empty">Fallo de red: ${e.message}</div>`;
  }
}

if(sb){
  cargarSelect('clientes','clienteSel');
  cargarSelect('transportistas','transSel');
  cargarHistorial();
  setInterval(cargarHistorial, 8000);
} else {
  document.getElementById('enviarMsg').textContent = '⚠️ Configura Supabase arriba en el script para poder usar el panel.';
  document.getElementById('historial').innerHTML = '<div class="empty">Conecta Supabase para ver el historial</div>';
}
}catch(e){
  document.body.innerHTML = '<div style="padding:20px;font-family:sans-serif;color:#c00">Error cargando el panel: '+e.message+'</div>';
}
</script>
</body>
</html>
